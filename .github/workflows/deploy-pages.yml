name: Deploy clearance iframe pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      # IMPORTANT:
      # Do NOT rebuild iframe HTML in GitHub Actions.
      # The Windows daily monitor is authoritative because it owns the
      # persistent product state and known-good SOLD OUT image cache.
      # GitHub Pages simply deploys the committed site/ output verbatim.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
