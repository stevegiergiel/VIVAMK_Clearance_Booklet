name: EzeGet Daily Clearance Heartbeat

on:
  schedule:
    # 12:00 UTC = 13:00 UK during British Summer Time.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ezeget-daily-clearance-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore monitor state and retained images
        id: restore-monitor-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            monitor_state
            monitor_cache
            cache
          key: clearance-monitor-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            clearance-monitor-${{ github.ref_name }}-

      - name: Check heartbeat email secrets
        env:
          SMTP_USER: ${{ secrets.EZEGET_HEARTBEAT_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.EZEGET_HEARTBEAT_APP_PASSWORD }}
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "Missing required repository secrets EZEGET_HEARTBEAT_EMAIL and/or EZEGET_HEARTBEAT_APP_PASSWORD."
            exit 1
          fi

      - name: Create runtime email configuration
        env:
          SMTP_USER: ${{ secrets.EZEGET_HEARTBEAT_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.EZEGET_HEARTBEAT_APP_PASSWORD }}
          HEARTBEAT_TO: ${{ secrets.EZEGET_HEARTBEAT_TO }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          user = os.environ["SMTP_USER"].strip()
          password = os.environ["SMTP_PASSWORD"].strip()
          recipient = os.environ.get("HEARTBEAT_TO", "").strip() or user
          Path("email_config.ini").write_text(
              "[Email]\n"
              f"sender_email={user}\n"
              f"app_password={password}\n\n"
              "[Settings]\n"
              "smtp_server=smtp.gmail.com\n"
              "smtp_port=587\n"
              f"smtp_user={user}\n"
              f"smtp_password={password}\n"
              f"to_email={recipient}\n",
              encoding="utf-8",
          )
          PY

      - name: Configure Git identity
        run: |
          git config user.name "EzeGet Daily Monitor"
          git config user.email "actions@users.noreply.github.com"

      - name: Run daily catalogue monitor and send heartbeat
        run: python run_daily_monitor_with_petals_paws.py

      - name: Publish regenerated iframe pages through protected main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet origin/main..HEAD; then
            echo "No generated site commit to publish."
            exit 0
          fi

          branch="automation/daily-catalogue-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${branch}"

          pr_url=$(gh pr create \
            --base main \
            --head "${branch}" \
            --title "Daily catalogue monitor refresh" \
            --body "Automated iframe refresh generated by the EzeGet daily clearance heartbeat. Stock/status decisions were made by the existing monitor safeguards; this PR contains presentation output only.")

          echo "Created ${pr_url}"
          gh pr merge "${pr_url}" --merge --delete-branch

      - name: Save successful monitor state and retained images
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            monitor_state
            monitor_cache
            cache
          key: clearance-monitor-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload monitor logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-monitor-logs-${{ github.run_id }}
          path: |
            monitor_logs
            output/christmas/live_audit
          if-no-files-found: ignore
          retention-days: 14
